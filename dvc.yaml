  # ============================================================
  # Validation — add stages here once scripts/validation/ has content
  # e.g. per-airshed out-of-site CV, depends on models/
  # ============================================================


  # ============================================================
  # Prediction pipeline (step 6+). Everything here writes under
  # data/prediction/; data/training/ is never touched.
  #
  # The per-source feature extractors are the SAME scripts the training stages
  # use, invoked with the grid in place of the station roster. That is
  # deliberate: the model was fitted on features those exact scripts produced,
  # so a separate copy of the computation would drift and silently feed it a
  # different quantity. Only genuinely prediction-specific logic lives in
  # scripts/prediction/.
  # ============================================================

  predict_build_grid:
    cmd: python scripts/prediction/grid/01_build_grid.py --stations 
      data/stations/cpcb_stations_delhi_status.csv --output 
      data/prediction/processed/grid_1km_delhi.csv --summary_output 
      data/prediction/interim/grid_1km_build_summary.csv
    deps:
    - scripts/prediction/grid/01_build_grid.py
    - data/stations/cpcb_stations_delhi_status.csv
    params:
    - prediction.grid
    outs:
    - data/prediction/processed/grid_1km_delhi.csv
    - data/prediction/interim/grid_1km_build_summary.csv

  # Frozen once it has run, like the 12 training external-fetch stages: OSM
  # changes continuously, so re-querying would silently change the features
  # under a fixed model. Unfreeze deliberately to refresh the snapshot.
  predict_download_osm:
    frozen: true
    cmd: python scripts/prediction/features/01_download_osm_extract.py 
      --roads_output data/prediction/raw/osm/roads.geojson --industrial_output 
      data/prediction/raw/osm/industrial_landuse.geojson --powerplants_output 
      data/prediction/raw/osm/power_plants.geojson --summary_output 
      data/prediction/raw/osm/osm_export_summary.csv --parts_dir 
      data/prediction/interim/osm_tiles
    deps:
    - scripts/prediction/features/01_download_osm_extract.py
    params:
    - prediction.osm_export
    outs:
    - data/prediction/raw/osm/roads.geojson
    - data/prediction/raw/osm/industrial_landuse.geojson
    - data/prediction/raw/osm/power_plants.geojson
    - data/prediction/raw/osm/osm_export_summary.csv

