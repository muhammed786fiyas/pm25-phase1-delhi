  # ERA5-Land and ERA5 BLH for the grid. Same scripts and params as the station
  # chain; only the roster and paths differ.
  #
  # Cheap despite 2388 cells, because reanalysis is coarse and the extractor
  # already deduplicates to unique PIXELS: the grid collapses onto 33 ERA5-Land
  # cells against the stations' 15, so extraction is ~2.2x the station cost
  # rather than 57x. ERA5 (BLH) is coarser still.
  #
  # The mapping stage runs batched (--batch_size 300): one reduceRegions call
  # per 300 points instead of one getInfo per point, 14 s instead of ~40 min.
  # Verified against the committed station mapping -- cell_lat/cell_lon match to
  # 1e-12 and the station-to-cell GROUPINGS are identical; only the arbitrary
  # sequential cell_id label differs, since batching meets cells in a different
  # order. cell_id is an internal join key used consistently within one mapping
  # file, so that is safe.
  predict_map_cells_era5_land:
    cmd: python scripts/datasets/era5_land/1-map_stations_to_cells.py --stations data/prediction/processed/grid_1km_delhi.csv --params params.yaml --batch_size 300 --outdir data/prediction/raw/era5_land
