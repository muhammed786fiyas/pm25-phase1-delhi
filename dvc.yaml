stages:
  # ============================================================
  # CPCB ground-station pipeline (Phase 1: Delhi)
  # ============================================================
  cpcb_list_stations:
    cmd: python scripts/datasets/cpcb/2-list_stations.py
    deps:
      - scripts/datasets/cpcb/2-list_stations.py
    outs:
      - data/stations:
          cache: false

  cpcb_download_pm25:
    cmd: python scripts/datasets/cpcb/3-download_pm25.py
    deps:
      - scripts/datasets/cpcb/3-download_pm25.py
      - scripts/datasets/cpcb/1-cpcb_fetcher.py
      - data/stations/cpcb_stations_delhi_status.csv
    outs:
      - data/raw/cpcb

  cpcb_merge_downloads:
    cmd: python scripts/datasets/cpcb/5-merge_downloads.py --dir1 data/raw/cpcb/pm25_delhi_2025 --dir2 data/raw/cpcb/pm25_delhi_2026_q1 --outdir data/interim/cpcb/pm25_delhi_merged
    deps:
      - scripts/datasets/cpcb/5-merge_downloads.py
      - data/raw/cpcb/pm25_delhi_2025
      - data/raw/cpcb/pm25_delhi_2026_q1
    outs:
      - data/interim/cpcb/pm25_delhi_merged

  cpcb_trim_and_season:
    cmd: python scripts/datasets/cpcb/6-trim_and_season.py --input data/interim/cpcb/pm25_delhi_merged/ALL_COMBINED.csv --outdir data/processed/cpcb/pm25_delhi_windowed
    deps:
      - scripts/datasets/cpcb/6-trim_and_season.py
      - data/interim/cpcb/pm25_delhi_merged
    outs:
      - data/processed/cpcb/pm25_delhi_windowed

  cpcb_qc_check:
    cmd: python scripts/datasets/cpcb/7-cpcb_qc_check.py --input data/processed/cpcb/pm25_delhi_windowed/pm25_delhi_mar25_feb26_seasoned.csv --outdir data/interim/cpcb/pm25_qc_hourly
    deps:
      - scripts/datasets/cpcb/7-cpcb_qc_check.py
      - data/processed/cpcb/pm25_delhi_windowed
    params:
      - cpcb_qc.high_value_limit
      - cpcb_qc.stuck_run_limit
    outs:
      - data/interim/cpcb/pm25_qc_hourly
      - data/interim/cpcb/pm25_qc_hourly

  
  cpcb_filter_aggregate:
    cmd: python scripts/datasets/cpcb/8-filter_and_aggregate.py --input data/processed/cpcb/pm25_delhi_windowed/pm25_delhi_mar25_feb26_seasoned.csv --outdir data/processed/cpcb/pm25_daily
    deps:
      - scripts/datasets/cpcb/8-filter_and_aggregate.py
      - data/processed/cpcb/pm25_delhi_windowed
    params:
      - cpcb_filter_aggregate.drop_stations
      - cpcb_filter_aggregate.min_hours
    outs:
      - data/processed/cpcb/pm25_daily
  
  cpcb_find_clusters:
    cmd: python scripts/datasets/cpcb/9-find_station_clusters.py --stations data/stations/cpcb_stations_delhi_status.csv --outdir data/interim/cpcb/pm25_qc_daily
    deps:
      - scripts/datasets/cpcb/9-find_station_clusters.py
      - data/stations/cpcb_stations_delhi_status.csv
    outs:
      - data/interim/cpcb/pm25_qc_daily/station_clusters.csv
    
  cpcb_completeness_check:
    cmd: python scripts/datasets/cpcb/10-completeness_check.py --input data/processed/cpcb/pm25_daily/pm25_daily.csv --outdir data/interim/cpcb/pm25_qc_daily
    deps:
      - scripts/datasets/cpcb/10-completeness_check.py
      - data/processed/cpcb/pm25_daily
    params:
      - cpcb_completeness.threshold
    outs:
      - data/interim/cpcb/pm25_qc_daily/station_completeness.csv

  cpcb_correlation_check:
    cmd: python scripts/datasets/cpcb/11-correlation_check.py --daily data/processed/cpcb/pm25_daily/pm25_daily.csv --clusters data/interim/cpcb/pm25_qc_daily/station_clusters.csv --outdir data/interim/cpcb/pm25_qc_daily
    deps:
      - scripts/datasets/cpcb/11-correlation_check.py
      - data/processed/cpcb/pm25_daily
      - data/interim/cpcb/pm25_qc_daily/station_clusters.csv
    outs:
      - data/interim/cpcb/pm25_qc_daily/station_pair_correlation.csv
  
  cpcb_final_filter:
    cmd: python scripts/datasets/cpcb/12-final_filter.py --daily data/processed/cpcb/pm25_daily/pm25_daily.csv --stations data/stations/cpcb_stations_delhi_status.csv --outdir data/processed/cpcb/pm25_daily_final
    deps:
      - scripts/datasets/cpcb/12-final_filter.py
      - data/processed/cpcb/pm25_daily
      - data/stations/cpcb_stations_delhi_status.csv
    outs:
      - data/processed/cpcb/pm25_daily_final

  # ============================================================
  # MAIAC AOD pipeline
  # ============================================================
  maiac_extract:
    cmd: python scripts/datasets/maiac_aod/1-extract_gee_covariates.py --stations data/stations/cpcb_stations_delhi_status.csv --outdir data/raw/maiac
    deps:
      - scripts/datasets/maiac_aod/1-extract_gee_covariates.py
      - data/stations/cpcb_stations_delhi_status.csv
    params:
      - maiac_extract.gee_project
      - maiac_extract.collection
      - maiac_extract.bands
      - maiac_extract.study_start
      - maiac_extract.study_end
    outs:
      - data/raw/maiac

  aod_filter_scale:
    cmd: python scripts/datasets/maiac_aod/2-filter_and_scale_aod.py --input data/raw/maiac/maiac_aod_raw.csv --stations data/stations/cpcb_stations_delhi_status.csv --outdir data/interim/maiac_aod/filter_scale
    deps:
      - scripts/datasets/maiac_aod/2-filter_and_scale_aod.py
      - data/raw/maiac/maiac_aod_raw.csv
      - data/stations/cpcb_stations_delhi_status.csv
    params:
      - aod_filter_scale.scale_aod
      - aod_filter_scale.scale_uncertainty
      - aod_filter_scale.aod_valid_min
      - aod_filter_scale.aod_valid_max
      - aod_filter_scale.uncertainty_valid_min
      - aod_filter_scale.uncertainty_valid_max
    outs:
      - data/interim/maiac_aod/filter_scale

  aod_decode_qa:
    cmd: python scripts/datasets/maiac_aod/3-decode_qa.py --input data/interim/maiac_aod/filter_scale/maiac_aod_filtered_scaled.csv --outdir data/interim/maiac_aod/qa_decode
    deps:
      - scripts/datasets/maiac_aod/3-decode_qa.py
      - data/interim/maiac_aod/filter_scale/maiac_aod_filtered_scaled.csv
    outs:
      - data/interim/maiac_aod/qa_decode
  
  aod_qa_filter:
    cmd: python scripts/datasets/maiac_aod/4-apply_qa_filter.py --input data/interim/maiac_aod/qa_decode/maiac_aod_qa_decoded.csv --outdir data/interim/maiac_aod/qa_filter
    deps:
      - scripts/datasets/maiac_aod/4-apply_qa_filter.py
      - data/interim/maiac_aod/qa_decode/maiac_aod_qa_decoded.csv
    params:
      - aod_qa_filter.strictness
    outs:
      - data/interim/maiac_aod/qa_filter
  
  aod_aggregate_daily:
    cmd: python scripts/datasets/maiac_aod/5-aggregate_aod_daily.py --input data/interim/maiac_aod/qa_filter/maiac_aod_qa_filtered.csv --outdir data/processed/maiac_aod
    deps:
      - scripts/datasets/maiac_aod/5-aggregate_aod_daily.py
      - data/interim/maiac_aod/qa_filter/maiac_aod_qa_filtered.csv
    outs:
      - data/processed/maiac_aod


  # ============================================================  
  # maiac_gapfill (calibrated MERRA-2 fill)
  # ============================================================
  map_stations_to_cells:
    cmd: python scripts/datasets/merra2_aod/1-map_stations_to_cells.py
      --stations data/stations/cpcb_stations_delhi_status.csv
      --outdir data/raw/merra2_aod
      --params params.yaml
    deps:
      - scripts/datasets/merra2_aod/1-map_stations_to_cells.py
      - data/stations/cpcb_stations_delhi_status.csv
    params:
      - merra2_station_mapping
    outs:
      - data/raw/merra2_aod/station_cell_mapping.csv
    
  extract_merra2:
    cmd: python scripts/datasets/merra2_aod/2-extract_gee_merra2.py
      --mapping data/raw/merra2_aod/station_cell_mapping.csv
      --outdir data/raw/merra2_aod
      --params params.yaml
    deps:
      - scripts/datasets/merra2_aod/2-extract_gee_merra2.py
      - data/raw/merra2_aod/station_cell_mapping.csv
    params:
      - merra2_extraction
    outs:
      - data/raw/merra2_aod/merra2_aod_raw.csv
  window_qc_merra2:
    cmd: python scripts/datasets/merra2_aod/3-window_and_qc_merra2.py
      --raw data/raw/merra2_aod/merra2_aod_raw.csv
      --mapping data/raw/merra2_aod/station_cell_mapping.csv
      --outdir data/interim/merra2_aod
      --params params.yaml
    deps:
      - scripts/datasets/merra2_aod/3-window_and_qc_merra2.py
      - data/raw/merra2_aod/merra2_aod_raw.csv
      - data/raw/merra2_aod/station_cell_mapping.csv
    params:
      - merra2_windowing_qc
    outs:
      - data/interim/merra2_aod/merra2_aod_windowed_qc.csv

  aggregate_merra2:
    cmd: python scripts/datasets/merra2_aod/4-aggregate_merra2_daily.py
      --windowed data/interim/merra2_aod/merra2_aod_windowed_qc.csv
      --mapping data/raw/merra2_aod/station_cell_mapping.csv
      --outdir data/processed/merra2_aod
      --params params.yaml
    deps:
      - scripts/datasets/merra2_aod/4-aggregate_merra2_daily.py
      - data/interim/merra2_aod/merra2_aod_windowed_qc.csv
      - data/raw/merra2_aod/station_cell_mapping.csv
    params:
      - merra2_aggregation
    outs:
      - data/processed/merra2_aod/merra2_aod_daily.csv
  # ============================================================
  # ERA5-Land meteorology 
  # ============================================================
  map_stations_to_cells_era5:
    cmd: python scripts/datasets/era5_land/1-map_stations_to_cells.py --stations data/stations/cpcb_stations_delhi_status.csv --params params.yaml --outdir data/raw/era5_land
    deps:
      - scripts/datasets/era5_land/1-map_stations_to_cells.py
      - data/stations/cpcb_stations_delhi_status.csv
    params:
      - era5_land.map_stations_to_cells
    outs:
      - data/raw/era5_land/station_cell_mapping.csv
  
  extract_era5_land:
    cmd: python scripts/datasets/era5_land/2-extract_gee_era5land.py --mapping data/raw/era5_land/station_cell_mapping.csv --params params.yaml --outdir data/raw/era5_land
    deps:
      - scripts/datasets/era5_land/2-extract_gee_era5land.py
      - data/raw/era5_land/station_cell_mapping.csv
    params:
      - era5_land.extract
    outs:
      - data/raw/era5_land/era5_land_raw.csv

  window_qc_era5_land:
    cmd: python scripts/datasets/era5_land/3-window_and_qc_era5land.py --raw data/raw/era5_land/era5_land_raw.csv --mapping data/raw/era5_land/station_cell_mapping.csv --params params.yaml --outdir data/interim/era5_land
    deps:
      - scripts/datasets/era5_land/3-window_and_qc_era5land.py
      - data/raw/era5_land/era5_land_raw.csv
      - data/raw/era5_land/station_cell_mapping.csv
    params:
      - era5_land.window_qc
    outs:
      - data/interim/era5_land/era5_land_windowed.csv
      - data/interim/era5_land/era5_land_window_summary.csv
  
  aggregate_era5_land_daily:
    cmd: python scripts/datasets/era5_land/4-aggregate_era5land_daily.py --windowed data/interim/era5_land/era5_land_windowed.csv --params params.yaml --outdir data/processed/era5_land
    deps:
      - scripts/datasets/era5_land/4-aggregate_era5land_daily.py
      - data/interim/era5_land/era5_land_windowed.csv
    params:
      - era5_land.daily_aggregation
    outs:
      - data/processed/era5_land/era5_land_daily.csv
      - data/processed/era5_land/era5_land_daily_summary.csv
  
  # ============================================================
  # ERA5-BLH
  # ============================================================
  map_stations_to_cells_era5_blh:
    cmd: python scripts/datasets/era5_blh/1-map_stations_to_cells.py --stations data/stations/cpcb_stations_delhi_status.csv --params params.yaml --outdir data/raw/era5_blh
    deps:
      - scripts/datasets/era5_blh/1-map_stations_to_cells.py
      - data/stations/cpcb_stations_delhi_status.csv
    params:
      - era5_blh.map_stations_to_cells
    outs:
      - data/raw/era5_blh/station_cell_mapping.csv
  
  extract_era5_blh:
    cmd: python scripts/datasets/era5_blh/2-extract_gee_era5blh.py --mapping data/raw/era5_blh/station_cell_mapping.csv --params params.yaml --outdir data/raw/era5_blh
    deps:
      - scripts/datasets/era5_blh/2-extract_gee_era5blh.py
      - data/raw/era5_blh/station_cell_mapping.csv
    params:
      - era5_blh.extract
    outs:
      - data/raw/era5_blh/era5_blh_raw.csv
  
  window_qc_era5_blh:
    cmd: python scripts/datasets/era5_blh/3-window_and_qc_era5blh.py --raw data/raw/era5_blh/era5_blh_raw.csv --mapping data/raw/era5_blh/station_cell_mapping.csv --params params.yaml --outdir data/interim/era5_blh
    deps:
      - scripts/datasets/era5_blh/3-window_and_qc_era5blh.py
      - data/raw/era5_blh/era5_blh_raw.csv
      - data/raw/era5_blh/station_cell_mapping.csv
    params:
      - era5_blh.window_qc
    outs:
      - data/interim/era5_blh/era5_blh_windowed.csv
      - data/interim/era5_blh/era5_blh_window_summary.csv
  
  aggregate_era5_blh_daily:
    cmd: python scripts/datasets/era5_blh/4-aggregate_era5blh_daily.py --windowed data/interim/era5_blh/era5_blh_windowed.csv --params params.yaml --outdir data/processed/era5_blh
    deps:
      - scripts/datasets/era5_blh/4-aggregate_era5blh_daily.py
      - data/interim/era5_blh/era5_blh_windowed.csv
    params:
      - era5_blh.daily_aggregation
    outs:
      - data/processed/era5_blh/era5_blh_daily.csv
      - data/processed/era5_blh/era5_blh_daily_summary.csv

  # ============================================================
  # OSM / static covariates (roads, land use, elevation) —
  # add stages here once scripts/datasets/osm/ exists
  # ============================================================

  # ============================================================
  # Modeling — add stages here once scripts/modeling/ has content
  # e.g. lme_fit_delhi (depends on cpcb_trim_and_season + maiac stages,
  # outputs to models/)
  # ============================================================

  # ============================================================
  # Validation — add stages here once scripts/validation/ has content
  # e.g. per-airshed out-of-site CV, depends on models/
  # ============================================================