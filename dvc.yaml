    outs:
      - data/prediction/raw/maiac_gapfill/station_calibration_raw.csv

  predict_gapfill_qc_calibration:
    cmd: python scripts/datasets/maiac_gapfill/03_qc_calibration.py --input data/prediction/raw/maiac_gapfill/station_calibration_raw.csv --station_file data/prediction/processed/grid_1km_delhi.csv --output data/prediction/interim/maiac_gapfill/calibration_qc_summary.csv --params params.yaml
