stages:
  # ============================================================
  # CPCB ground-station pipeline (Phase 1: Delhi)
  # ============================================================
  # Stages that fetch from external services (OpenAQ, Earth Engine) are frozen:
  # dvc repro does not re-run them, and everything downstream is rebuilt from
  # their saved output. The services can revise historical data, so the saved
  # snapshot is what makes the results reproducible. To refresh the data (or
  # to run a new city), unfreeze deliberately:  dvc unfreeze <stage>
  cpcb_list_stations:
    frozen: true
    cmd: python scripts/datasets/cpcb/2-list_stations.py --region delhi --output
      cpcb_stations_delhi.csv --output-dir data/stations
    deps:
    - scripts/datasets/cpcb/2-list_stations.py
    - scripts/datasets/cpcb/cpcb_fetcher.py
    outs:
      # Only the file this stage actually writes. It previously claimed the
      # whole data/stations/ directory, which also holds the hand-curated
      # cpcb_stations_delhi_status.csv -- and DVC removes a stage's outputs
      # before re-running it, so a repro would have deleted the curated roster.
    - data/stations/cpcb_stations_delhi.csv:
        cache: false

  cpcb_screen_stations:
    cmd: python scripts/datasets/cpcb/2b-screen_stations.py --input 
      data/stations/cpcb_stations_delhi.csv --output 
      data/stations/cpcb_stations_delhi_screened.csv
    deps:
    - scripts/datasets/cpcb/2b-screen_stations.py
    - data/stations/cpcb_stations_delhi.csv
    params:
    - cpcb_screen_stations
    outs:
    - data/stations/cpcb_stations_delhi_screened.csv:
        cache: false

  # Two date ranges because the data was pulled in two batches (2025, then
  # Q1 2026 once it existed). Downloads the screened ELIGIBLE stations -- not
  # the final KEEP roster, which cannot be known until after downloading.
  cpcb_download_pm25:
    frozen: true
    cmd:
    - python scripts/datasets/cpcb/3-download_pm25.py --stations 
      data/stations/cpcb_stations_delhi_screened.csv --from-date 2025-01-01 
      --to-date 2025-12-31 --outdir data/training/raw/cpcb/pm25_delhi_2025
    - python scripts/datasets/cpcb/3-download_pm25.py --stations 
      data/stations/cpcb_stations_delhi_screened.csv --from-date 2026-01-01 
      --to-date 2026-03-31 --outdir data/training/raw/cpcb/pm25_delhi_2026_q1
    deps:
    - scripts/datasets/cpcb/3-download_pm25.py
    - data/stations/cpcb_stations_delhi_screened.csv
    outs:
    - data/training/raw/cpcb

  cpcb_merge_downloads:
    cmd: python scripts/datasets/cpcb/5-merge_downloads.py --dir1 
      data/training/raw/cpcb/pm25_delhi_2025 --dir2 
      data/training/raw/cpcb/pm25_delhi_2026_q1 --outdir 
      data/training/interim/cpcb/pm25_delhi_merged
    deps:
    - scripts/datasets/cpcb/5-merge_downloads.py
    - data/training/raw/cpcb/pm25_delhi_2025
    - data/training/raw/cpcb/pm25_delhi_2026_q1
    outs:
    - data/training/interim/cpcb/pm25_delhi_merged

  cpcb_trim_and_season:
    cmd: python scripts/datasets/cpcb/6-trim_and_season.py --input 
      data/training/interim/cpcb/pm25_delhi_merged/ALL_COMBINED.csv --outdir 
      data/training/processed/cpcb/pm25_delhi_windowed
    deps:
    - scripts/datasets/cpcb/6-trim_and_season.py
    - data/training/interim/cpcb/pm25_delhi_merged
    outs:
    - data/training/processed/cpcb/pm25_delhi_windowed

  cpcb_qc_check:
    cmd: python scripts/datasets/cpcb/7-cpcb_qc_check.py --input 
      data/training/processed/cpcb/pm25_delhi_windowed/pm25_delhi_mar25_feb26_seasoned.csv
      --outdir data/training/interim/cpcb/pm25_qc_hourly
    deps:
    - scripts/datasets/cpcb/7-cpcb_qc_check.py
    - data/training/processed/cpcb/pm25_delhi_windowed
    params:
    - cpcb_qc.high_value_limit
    - cpcb_qc.stuck_run_limit
    outs:
    - data/training/interim/cpcb/pm25_qc_hourly


  cpcb_filter_aggregate:
    cmd: python scripts/datasets/cpcb/8-filter_and_aggregate.py --input 
      data/training/processed/cpcb/pm25_delhi_windowed/pm25_delhi_mar25_feb26_seasoned.csv
      --outdir data/training/processed/cpcb/pm25_daily
    deps:
    - scripts/datasets/cpcb/8-filter_and_aggregate.py
    - data/training/processed/cpcb/pm25_delhi_windowed
    params:
    - cpcb_filter_aggregate.min_hours
    outs:
    - data/training/processed/cpcb/pm25_daily

  cpcb_find_clusters:
    cmd: python scripts/datasets/cpcb/9-find_station_clusters.py --stations 
      data/stations/cpcb_stations_delhi_status.csv --outdir 
      data/training/interim/cpcb/pm25_qc_daily
    deps:
    - scripts/datasets/cpcb/9-find_station_clusters.py
    - data/stations/cpcb_stations_delhi_status.csv
    outs:
    - data/training/interim/cpcb/pm25_qc_daily/station_clusters.csv

  cpcb_completeness_check:
    cmd: python scripts/datasets/cpcb/10-completeness_check.py --input 
      data/training/processed/cpcb/pm25_daily/pm25_daily.csv --outdir 
      data/training/interim/cpcb/pm25_qc_daily
    deps:
    - scripts/datasets/cpcb/10-completeness_check.py
    - data/training/processed/cpcb/pm25_daily
    params:
    - cpcb_completeness
    outs:
    - data/training/interim/cpcb/pm25_qc_daily/station_completeness.csv

  cpcb_correlation_check:
    cmd: python scripts/datasets/cpcb/11-correlation_check.py --daily 
      data/training/processed/cpcb/pm25_daily/pm25_daily.csv --clusters 
      data/training/interim/cpcb/pm25_qc_daily/station_clusters.csv --outdir 
      data/training/interim/cpcb/pm25_qc_daily
    deps:
    - scripts/datasets/cpcb/11-correlation_check.py
    - data/training/processed/cpcb/pm25_daily
    - data/training/interim/cpcb/pm25_qc_daily/station_clusters.csv
    outs:
    - data/training/interim/cpcb/pm25_qc_daily/station_pair_correlation.csv

  # Turns the screened list into the final roster: ELIGIBLE -> KEEP or
  # DROP_low_completeness, then applies the hand-written overrides file (the
  # only place a manual decision enters). Writes to the same path the 35
  # downstream stages already read, so none of them needed editing.
  cpcb_finalize_roster:
    cmd: python scripts/datasets/cpcb/10b-finalize_roster.py --screened 
      data/stations/cpcb_stations_delhi_screened.csv --completeness 
      data/training/interim/cpcb/pm25_qc_daily/station_completeness.csv 
      --overrides data/stations/cpcb_station_overrides_delhi.csv --output 
      data/stations/cpcb_stations_delhi_status.csv
    deps:
    - scripts/datasets/cpcb/10b-finalize_roster.py
    - data/stations/cpcb_stations_delhi_screened.csv
    - data/training/interim/cpcb/pm25_qc_daily/station_completeness.csv
    - data/stations/cpcb_station_overrides_delhi.csv
    outs:
    - data/stations/cpcb_stations_delhi_status.csv:
        cache: false

  cpcb_final_filter:
    cmd: python scripts/datasets/cpcb/12-final_filter.py --daily 
      data/training/processed/cpcb/pm25_daily/pm25_daily.csv --stations 
      data/stations/cpcb_stations_delhi_status.csv --outdir 
      data/training/processed/cpcb/pm25_daily_final
    deps:
    - scripts/datasets/cpcb/12-final_filter.py
    - data/training/processed/cpcb/pm25_daily
    - data/stations/cpcb_stations_delhi_status.csv
    outs:
    - data/training/processed/cpcb/pm25_daily_final

  # ============================================================
  # MAIAC AOD pipeline
  # ============================================================
  maiac_extract:
    frozen: true
    cmd: python scripts/datasets/maiac_aod/1-extract_gee_covariates.py 
      --stations data/stations/cpcb_stations_delhi_status.csv --outdir 
      data/training/raw/maiac
    deps:
    - scripts/datasets/maiac_aod/1-extract_gee_covariates.py
    - data/stations/cpcb_stations_delhi_status.csv
    params:
    - maiac_extract.gee_project
    - maiac_extract.collection
    - maiac_extract.bands
    - maiac_extract.study_start
    - maiac_extract.study_end
    outs:
    - data/training/raw/maiac

  aod_filter_scale:
    cmd: python scripts/datasets/maiac_aod/2-filter_and_scale_aod.py --input 
      data/training/raw/maiac/maiac_aod_raw.csv --stations 
      data/stations/cpcb_stations_delhi_status.csv --outdir 
      data/training/interim/maiac_aod/filter_scale
    deps:
    - scripts/datasets/maiac_aod/2-filter_and_scale_aod.py
    - data/training/raw/maiac/maiac_aod_raw.csv
    - data/stations/cpcb_stations_delhi_status.csv
    params:
    - aod_filter_scale.scale_aod
    - aod_filter_scale.scale_uncertainty
    - aod_filter_scale.aod_valid_min
    - aod_filter_scale.aod_valid_max
    - aod_filter_scale.uncertainty_valid_min
    - aod_filter_scale.uncertainty_valid_max
    outs:
    - data/training/interim/maiac_aod/filter_scale

  aod_decode_qa:
    cmd: python scripts/datasets/maiac_aod/3-decode_qa.py --input 
      data/training/interim/maiac_aod/filter_scale/maiac_aod_filtered_scaled.csv
      --outdir data/training/interim/maiac_aod/qa_decode
    deps:
    - scripts/datasets/maiac_aod/3-decode_qa.py
    - data/training/interim/maiac_aod/filter_scale/maiac_aod_filtered_scaled.csv
    outs:
    - data/training/interim/maiac_aod/qa_decode

  aod_qa_filter:
    cmd: python scripts/datasets/maiac_aod/4-apply_qa_filter.py --input 
      data/training/interim/maiac_aod/qa_decode/maiac_aod_qa_decoded.csv 
      --outdir data/training/interim/maiac_aod/qa_filter
    deps:
    - scripts/datasets/maiac_aod/4-apply_qa_filter.py
    - data/training/interim/maiac_aod/qa_decode/maiac_aod_qa_decoded.csv
    params:
    - aod_qa_filter.strictness
    outs:
    - data/training/interim/maiac_aod/qa_filter

  aod_aggregate_daily:
    cmd: python scripts/datasets/maiac_aod/5-aggregate_aod_daily.py --input 
      data/training/interim/maiac_aod/qa_filter/maiac_aod_qa_filtered.csv 
      --outdir data/training/processed/maiac_aod
    deps:
    - scripts/datasets/maiac_aod/5-aggregate_aod_daily.py
    - data/training/interim/maiac_aod/qa_filter/maiac_aod_qa_filtered.csv
    outs:
    - data/training/processed/maiac_aod


  # ============================================================  
  # maiac_gapfill (calibrated MERRA-2 fill)
  # ============================================================
  map_stations_to_cells:
    frozen: true
    cmd: python scripts/datasets/merra2_aod/1-map_stations_to_cells.py 
      --stations data/stations/cpcb_stations_delhi_status.csv --outdir 
      data/training/raw/merra2_aod --params params.yaml
    deps:
    - scripts/datasets/merra2_aod/1-map_stations_to_cells.py
    - data/stations/cpcb_stations_delhi_status.csv
    params:
    - merra2_station_mapping
    outs:
    - data/training/raw/merra2_aod/station_cell_mapping.csv

  extract_merra2:
    frozen: true
    cmd: python scripts/datasets/merra2_aod/2-extract_gee_merra2.py --mapping 
      data/training/raw/merra2_aod/station_cell_mapping.csv --outdir 
      data/training/raw/merra2_aod --params params.yaml
    deps:
    - scripts/datasets/merra2_aod/2-extract_gee_merra2.py
    - data/training/raw/merra2_aod/station_cell_mapping.csv
    params:
    - merra2_extraction
    outs:
    - data/training/raw/merra2_aod/merra2_aod_raw.csv
  window_qc_merra2:
    cmd: python scripts/datasets/merra2_aod/3-window_and_qc_merra2.py --raw 
      data/training/raw/merra2_aod/merra2_aod_raw.csv --mapping 
      data/training/raw/merra2_aod/station_cell_mapping.csv --outdir 
      data/training/interim/merra2_aod --params params.yaml
    deps:
    - scripts/datasets/merra2_aod/3-window_and_qc_merra2.py
    - data/training/raw/merra2_aod/merra2_aod_raw.csv
    - data/training/raw/merra2_aod/station_cell_mapping.csv
    params:
    - merra2_windowing_qc
    outs:
    - data/training/interim/merra2_aod/merra2_aod_windowed_qc.csv

  aggregate_merra2:
    cmd: python scripts/datasets/merra2_aod/4-aggregate_merra2_daily.py 
      --windowed data/training/interim/merra2_aod/merra2_aod_windowed_qc.csv 
      --mapping data/training/raw/merra2_aod/station_cell_mapping.csv --outdir 
      data/training/processed/merra2_aod --params params.yaml
    deps:
    - scripts/datasets/merra2_aod/4-aggregate_merra2_daily.py
    - data/training/interim/merra2_aod/merra2_aod_windowed_qc.csv
    - data/training/raw/merra2_aod/station_cell_mapping.csv
    params:
    - merra2_aggregation
    outs:
    - data/training/processed/merra2_aod/merra2_aod_daily.csv

  # ============================================================
  # MAIAC gap-fill calibration (per-station MAIAC ~ a + b*MERRA2)
  # ============================================================
  maiac_gapfill_build_dataset:
    cmd: python scripts/datasets/maiac_gapfill/01_build_calibration_dataset.py 
      --maiac_input data/training/processed/maiac_aod/maiac_aod_daily.csv 
      --merra2_input data/training/processed/merra2_aod/merra2_aod_daily.csv 
      --station_file data/stations/cpcb_stations_delhi_status.csv --output 
      data/training/raw/maiac_gapfill/calibration_dataset.csv --summary_output 
      data/training/raw/maiac_gapfill/overlap_summary.csv
    deps:
    - scripts/datasets/maiac_gapfill/01_build_calibration_dataset.py
    - data/training/processed/maiac_aod/maiac_aod_daily.csv
    - data/training/processed/merra2_aod/merra2_aod_daily.csv
    - data/stations/cpcb_stations_delhi_status.csv
    outs:
    - data/training/raw/maiac_gapfill/calibration_dataset.csv
    - data/training/raw/maiac_gapfill/overlap_summary.csv

  maiac_gapfill_fit_calibration:
    cmd: python scripts/datasets/maiac_gapfill/02_fit_station_calibration.py 
      --input data/training/raw/maiac_gapfill/calibration_dataset.csv 
      --station_file data/stations/cpcb_stations_delhi_status.csv --output 
      data/training/raw/maiac_gapfill/station_calibration_raw.csv --params 
      params.yaml
    deps:
    - scripts/datasets/maiac_gapfill/02_fit_station_calibration.py
    - data/training/raw/maiac_gapfill/calibration_dataset.csv
    - data/stations/cpcb_stations_delhi_status.csv
    params:
    - maiac_gapfill.calibration
    outs:
    - data/training/raw/maiac_gapfill/station_calibration_raw.csv

  maiac_gapfill_qc_calibration:
    cmd: python scripts/datasets/maiac_gapfill/03_qc_calibration.py --input 
      data/training/raw/maiac_gapfill/station_calibration_raw.csv --station_file
      data/stations/cpcb_stations_delhi_status.csv --output 
      data/training/interim/maiac_gapfill/calibration_qc_summary.csv --params 
      params.yaml
    deps:
    - scripts/datasets/maiac_gapfill/03_qc_calibration.py
    - data/training/raw/maiac_gapfill/station_calibration_raw.csv
    - data/stations/cpcb_stations_delhi_status.csv
    params:
    - maiac_gapfill.qc
    outs:
    - data/training/interim/maiac_gapfill/calibration_qc_summary.csv

  maiac_gapfill_score_confidence:
    cmd: python scripts/datasets/maiac_gapfill/04_score_confidence.py --input 
      data/training/raw/maiac_gapfill/calibration_dataset.csv --residuals_output
      data/training/interim/maiac_gapfill/loocv_residuals.csv --output 
      data/training/processed/maiac_gapfill/confidence_scores.csv --params 
      params.yaml
    deps:
    - scripts/datasets/maiac_gapfill/04_score_confidence.py
    - data/training/raw/maiac_gapfill/calibration_dataset.csv
    - data/training/interim/maiac_gapfill/calibration_qc_summary.csv
    params:
    - maiac_gapfill.calibration
    - maiac_gapfill.confidence
    outs:
    - data/training/interim/maiac_gapfill/loocv_residuals.csv
    - data/training/processed/maiac_gapfill/confidence_scores.csv

  maiac_gapfill_apply_fill:
    cmd: python scripts/datasets/maiac_gapfill/05_apply_gapfill.py --maiac_input
      data/training/processed/maiac_aod/maiac_aod_daily.csv --merra2_input 
      data/training/processed/merra2_aod/merra2_aod_daily.csv 
      --calibration_input 
      data/training/raw/maiac_gapfill/station_calibration_raw.csv 
      --confidence_input 
      data/training/processed/maiac_gapfill/confidence_scores.csv --station_file
      data/stations/cpcb_stations_delhi_status.csv --output 
      data/training/processed/maiac_gapfill/maiac_aod_gapfilled.csv 
      --summary_output data/training/processed/maiac_gapfill/fill_summary.csv 
      --params params.yaml
    deps:
    - scripts/datasets/maiac_gapfill/05_apply_gapfill.py
    - data/training/processed/maiac_aod/maiac_aod_daily.csv
    - data/training/processed/merra2_aod/merra2_aod_daily.csv
    - data/training/raw/maiac_gapfill/station_calibration_raw.csv
    - data/training/processed/maiac_gapfill/confidence_scores.csv
    - data/stations/cpcb_stations_delhi_status.csv
    params:
    - maiac_gapfill.fill
    outs:
    - data/training/processed/maiac_gapfill/maiac_aod_gapfilled.csv
    - data/training/processed/maiac_gapfill/fill_summary.csv

  # ============================================================
  # ERA5-Land meteorology 
  # ============================================================
  map_stations_to_cells_era5:
    frozen: true
    cmd: python scripts/datasets/era5_land/1-map_stations_to_cells.py --stations
      data/stations/cpcb_stations_delhi_status.csv --params params.yaml --outdir
      data/training/raw/era5_land
    deps:
    - scripts/datasets/era5_land/1-map_stations_to_cells.py
    - data/stations/cpcb_stations_delhi_status.csv
    params:
    - era5_land.map_stations_to_cells
    outs:
    - data/training/raw/era5_land/station_cell_mapping.csv

  extract_era5_land:
    frozen: true
    cmd: python scripts/datasets/era5_land/2-extract_gee_era5land.py --mapping 
      data/training/raw/era5_land/station_cell_mapping.csv --params params.yaml 
      --outdir data/training/raw/era5_land
    deps:
    - scripts/datasets/era5_land/2-extract_gee_era5land.py
    - data/training/raw/era5_land/station_cell_mapping.csv
    params:
    - era5_land.extract
    outs:
    - data/training/raw/era5_land/era5_land_raw.csv

  window_qc_era5_land:
    cmd: python scripts/datasets/era5_land/3-window_and_qc_era5land.py --raw 
      data/training/raw/era5_land/era5_land_raw.csv --mapping 
      data/training/raw/era5_land/station_cell_mapping.csv --params params.yaml 
      --outdir data/training/interim/era5_land
    deps:
    - scripts/datasets/era5_land/3-window_and_qc_era5land.py
    - data/training/raw/era5_land/era5_land_raw.csv
    - data/training/raw/era5_land/station_cell_mapping.csv
    params:
    - era5_land.window_qc
    outs:
    - data/training/interim/era5_land/era5_land_windowed.csv
    - data/training/interim/era5_land/era5_land_window_summary.csv

  aggregate_era5_land_daily:
    cmd: python scripts/datasets/era5_land/4-aggregate_era5land_daily.py 
      --windowed data/training/interim/era5_land/era5_land_windowed.csv --params
      params.yaml --outdir data/training/processed/era5_land
    deps:
    - scripts/datasets/era5_land/4-aggregate_era5land_daily.py
    - data/training/interim/era5_land/era5_land_windowed.csv
    params:
    - era5_land.daily_aggregation
    outs:
    - data/training/processed/era5_land/era5_land_daily.csv
    - data/training/processed/era5_land/era5_land_daily_summary.csv

  # ============================================================
  # ERA5-BLH
  # ============================================================
  map_stations_to_cells_era5_blh:
    frozen: true
    cmd: python scripts/datasets/era5_blh/1-map_stations_to_cells.py --stations 
      data/stations/cpcb_stations_delhi_status.csv --params params.yaml --outdir
      data/training/raw/era5_blh
    deps:
    - scripts/datasets/era5_blh/1-map_stations_to_cells.py
    - data/stations/cpcb_stations_delhi_status.csv
    params:
    - era5_blh.map_stations_to_cells
    outs:
    - data/training/raw/era5_blh/station_cell_mapping.csv

  extract_era5_blh:
    frozen: true
    cmd: python scripts/datasets/era5_blh/2-extract_gee_era5blh.py --mapping 
      data/training/raw/era5_blh/station_cell_mapping.csv --params params.yaml 
      --outdir data/training/raw/era5_blh
    deps:
    - scripts/datasets/era5_blh/2-extract_gee_era5blh.py
    - data/training/raw/era5_blh/station_cell_mapping.csv
    params:
    - era5_blh.extract
    outs:
    - data/training/raw/era5_blh/era5_blh_raw.csv

  window_qc_era5_blh:
    cmd: python scripts/datasets/era5_blh/3-window_and_qc_era5blh.py --raw 
      data/training/raw/era5_blh/era5_blh_raw.csv --mapping 
      data/training/raw/era5_blh/station_cell_mapping.csv --params params.yaml 
      --outdir data/training/interim/era5_blh
    deps:
    - scripts/datasets/era5_blh/3-window_and_qc_era5blh.py
    - data/training/raw/era5_blh/era5_blh_raw.csv
    - data/training/raw/era5_blh/station_cell_mapping.csv
    params:
    - era5_blh.window_qc
    outs:
    - data/training/interim/era5_blh/era5_blh_windowed.csv
    - data/training/interim/era5_blh/era5_blh_window_summary.csv

  aggregate_era5_blh_daily:
    cmd: python scripts/datasets/era5_blh/4-aggregate_era5blh_daily.py 
      --windowed data/training/interim/era5_blh/era5_blh_windowed.csv --params 
      params.yaml --outdir data/training/processed/era5_blh
    deps:
    - scripts/datasets/era5_blh/4-aggregate_era5blh_daily.py
    - data/training/interim/era5_blh/era5_blh_windowed.csv
    params:
