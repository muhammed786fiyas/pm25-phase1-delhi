stages:
  # ============================================================
  # CPCB ground-station pipeline (Phase 1: Delhi)
  # ============================================================
  cpcb_list_stations:
    cmd: python scripts/datasets/cpcb/2-list_stations.py
    deps:
      - scripts/datasets/cpcb/2-list_stations.py
    outs:
      - data/stations:
          cache: false

  cpcb_download_pm25:
    cmd: python scripts/datasets/cpcb/3-download_pm25.py
    deps:
      - scripts/datasets/cpcb/3-download_pm25.py
      - scripts/datasets/cpcb/1-cpcb_fetcher.py
      - data/stations/cpcb_stations_delhi_status.csv
    outs:
      - data/raw/cpcb

  cpcb_merge_downloads:
    cmd: python scripts/datasets/cpcb/5-merge_downloads.py --dir1 data/raw/cpcb/pm25_delhi_2025 --dir2 data/raw/cpcb/pm25_delhi_2026_q1 --outdir data/interim/cpcb/pm25_delhi_merged
    deps:
      - scripts/datasets/cpcb/5-merge_downloads.py
      - data/raw/cpcb/pm25_delhi_2025
      - data/raw/cpcb/pm25_delhi_2026_q1
    outs:
      - data/interim/cpcb/pm25_delhi_merged

  cpcb_trim_and_season:
    cmd: python scripts/datasets/cpcb/6-trim_and_season.py --input data/interim/cpcb/pm25_delhi_merged/ALL_COMBINED.csv --outdir data/processed/cpcb/pm25_delhi_windowed
    deps:
      - scripts/datasets/cpcb/6-trim_and_season.py
      - data/interim/cpcb/pm25_delhi_merged
    outs:
      - data/processed/cpcb/pm25_delhi_windowed

  cpcb_qc_check:
    cmd: python scripts/datasets/cpcb/7-cpcb_qc_check.py --input data/processed/cpcb/pm25_delhi_windowed/pm25_delhi_mar25_feb26_seasoned.csv --outdir data/interim/cpcb/pm25_qc_hourly
    deps:
      - scripts/datasets/cpcb/7-cpcb_qc_check.py
      - data/processed/cpcb/pm25_delhi_windowed
    params:
      - cpcb_qc.high_value_limit
      - cpcb_qc.stuck_run_limit
    outs:
      - data/interim/cpcb/pm25_qc_hourly
      - data/interim/cpcb/pm25_qc_hourly

  
  cpcb_filter_aggregate:
    cmd: python scripts/datasets/cpcb/8-filter_and_aggregate.py --input data/processed/cpcb/pm25_delhi_windowed/pm25_delhi_mar25_feb26_seasoned.csv --outdir data/processed/cpcb/pm25_daily
    deps:
      - scripts/datasets/cpcb/8-filter_and_aggregate.py
      - data/processed/cpcb/pm25_delhi_windowed
    params:
      - cpcb_filter_aggregate.drop_stations
      - cpcb_filter_aggregate.min_hours
    outs:
      - data/processed/cpcb/pm25_daily
  
  cpcb_find_clusters:
    cmd: python scripts/datasets/cpcb/9-find_station_clusters.py --stations data/stations/cpcb_stations_delhi_status.csv --outdir data/interim/cpcb/pm25_qc_daily
    deps:
      - scripts/datasets/cpcb/9-find_station_clusters.py
      - data/stations/cpcb_stations_delhi_status.csv
    outs:
      - data/interim/cpcb/pm25_qc_daily/station_clusters.csv
    
  cpcb_completeness_check:
    cmd: python scripts/datasets/cpcb/10-completeness_check.py --input data/processed/cpcb/pm25_daily/pm25_daily.csv --outdir data/interim/cpcb/pm25_qc_daily
    deps:
      - scripts/datasets/cpcb/10-completeness_check.py
      - data/processed/cpcb/pm25_daily
    params:
      - cpcb_completeness.threshold
    outs:
      - data/interim/cpcb/pm25_qc_daily/station_completeness.csv

  cpcb_correlation_check:
    cmd: python scripts/datasets/cpcb/11-correlation_check.py --daily data/processed/cpcb/pm25_daily/pm25_daily.csv --clusters data/interim/cpcb/pm25_qc_daily/station_clusters.csv --outdir data/interim/cpcb/pm25_qc_daily
    deps:
      - scripts/datasets/cpcb/11-correlation_check.py
      - data/processed/cpcb/pm25_daily
      - data/interim/cpcb/pm25_qc_daily/station_clusters.csv
    outs:
      - data/interim/cpcb/pm25_qc_daily/station_pair_correlation.csv
  
  cpcb_final_filter:
    cmd: python scripts/datasets/cpcb/12-final_filter.py --daily data/processed/cpcb/pm25_daily/pm25_daily.csv --stations data/stations/cpcb_stations_delhi_status.csv --outdir data/processed/cpcb/pm25_daily_final
    deps:
      - scripts/datasets/cpcb/12-final_filter.py
      - data/processed/cpcb/pm25_daily
      - data/stations/cpcb_stations_delhi_status.csv
    outs:
      - data/processed/cpcb/pm25_daily_final

  # ============================================================
  # MAIAC AOD pipeline
  # ============================================================
  maiac_extract:
    cmd: python scripts/datasets/maiac_aod/1-extract_gee_covariates.py --stations data/stations/cpcb_stations_delhi_status.csv --outdir data/raw/maiac
    deps:
      - scripts/datasets/maiac_aod/1-extract_gee_covariates.py
      - data/stations/cpcb_stations_delhi_status.csv
    params:
      - maiac_extract.gee_project
      - maiac_extract.collection
      - maiac_extract.bands
      - maiac_extract.study_start
      - maiac_extract.study_end
    outs:
      - data/raw/maiac

  # add more stages here once ready: maiac_filter_stations (after CPCB QC
  # finalizes the station list), maiac_preprocess (scale factor + QA decode),

  # ============================================================  
  # maiac_gapfill (calibrated MERRA-2 fill)
  # ============================================================
  map_stations_to_cells:
    cmd: python scripts/datasets/merra2_aod/1-map_stations_to_cells.py
      --stations data/stations/cpcb_stations_delhi_status.csv
      --outdir data/raw/merra2_aod
      --params params.yaml
    deps:
      - scripts/datasets/merra2_aod/1-map_stations_to_cells.py
      - data/stations/cpcb_stations_delhi_status.csv
    params:
      - merra2_station_mapping
    outs:
      - data/raw/merra2_aod/station_cell_mapping.csv
    
  extract_merra2:
    cmd: python scripts/datasets/merra2_aod/2-extract_gee_merra2.py
      --mapping data/raw/merra2_aod/station_cell_mapping.csv
      --outdir data/raw/merra2_aod
      --params params.yaml
    deps:
      - scripts/datasets/merra2_aod/2-extract_gee_merra2.py
      - data/raw/merra2_aod/station_cell_mapping.csv
    params:
      - merra2_extraction
    outs:
      - data/raw/merra2_aod/merra2_aod_raw.csv
  # ============================================================
  # ERA5-Land meteorology — add stages here once scripts/datasets/era5/ exists
  # ============================================================

  # ============================================================
  # OSM / static covariates (roads, land use, elevation) —
  # add stages here once scripts/datasets/osm/ exists
  # ============================================================

  # ============================================================
  # Modeling — add stages here once scripts/modeling/ has content
  # e.g. lme_fit_delhi (depends on cpcb_trim_and_season + maiac stages,
  # outputs to models/)
  # ============================================================

  # ============================================================
  # Validation — add stages here once scripts/validation/ has content
  # e.g. per-airshed out-of-site CV, depends on models/
  # ============================================================