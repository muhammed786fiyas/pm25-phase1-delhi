# ============================================================
# CPCB ground-station pipeline (Phase 1: Delhi)
# ============================================================
cpcb_qc:
  high_value_limit: 1000
  stuck_run_limit: 3

# Pre-download screening (2b-screen_stations.py). Uses only station metadata.
cpcb_screen_stations:
  study_start: "2025-03-01"
  study_end: "2026-02-28"
  duplicate_tolerance_km: 0.01   # "same coordinates" -- the one Delhi duplicate pair is ~0.1 m apart,
                                 # the next-closest eligible pair ~590 m, so 10 m is safely in between

cpcb_filter_aggregate:
  # drop_stations removed 2026-09-17: the four stations it listed (10820, 10900,
  # 10825, 6936) all fail the completeness threshold below, so the rule now drops them.
  min_hours: 2

cpcb_completeness:
  window_start: "2025-03-01"
  window_end: "2026-02-28"
  threshold: 60   # Delhi: all drops <= 44.1%, all KEEP >= 72.9%


# ============================================================
# MAIAC AOD pipeline
# ============================================================

maiac_extract:
  gee_project: "internship-pm25"
  collection: "MODIS/061/MCD19A2_GRANULES"
  bands: ["Optical_Depth_055", "Optical_Depth_047", "AOD_Uncertainty", "AOD_QA"]
  study_start: "2025-03-01"
  study_end: "2026-02-28"

aod_filter_scale:
  scale_aod: 0.001
  scale_uncertainty: 0.0001
  aod_valid_min: -0.1
  aod_valid_max: 8.0
  uncertainty_valid_min: 0.0
  uncertainty_valid_max: 3.0

aod_qa_filter:
  strictness: "moderate"

# ============================================================  
# maiac_gapfill (calibrated MERRA-2 fill)
# ============================================================

merra2_station_mapping:
  gee_project: "internship-pm25"
  collection: "NASA/GSFC/MERRA/aer/2"
  aot_band: "TOTEXTTAU"
  test_date_start: "2025-06-01"
  test_date_end: "2025-06-02"

merra2_extraction:
  gee_project: "internship-pm25"
  collection: "NASA/GSFC/MERRA/aer/2"
  aot_band: "TOTEXTTAU"
  date_start: "2025-03-01"
  date_end: "2026-03-01"   # exclusive in filterDate, so covers through Feb 28 2026
  scale_meters: 1000

merra2_windowing_qc:
  aot_band: "TOTEXTTAU"
  overpass_hours_utc: [5, 6, 7]
  totexttau_min: 0.0
  totexttau_max: 5.0            # loose sanity bound -- catches fill values/unit bugs, not real dust-storm spikes
  coord_tolerance_degrees: 0.05   # ~5.5km -- well above scale=1000 reprojection jitter (<1km seen),
                                    # well below cell spacing (~62km) -- still catches a genuine wrong-cell bug
merra2_aggregation:
  aot_band: "TOTEXTTAU"
  min_hours_required: 2

# ============================================================
# MAIAC gap-fill calibration (per-station MAIAC ~ a + b*MERRA2)
# ============================================================

maiac_gapfill:
  calibration:
    aod_column: "aod_055"
    merra2_column: "totexttau"

  qc:
    min_obs_for_fit: 20
    min_slope: 0.0
    r_squared_warn_threshold: 0.1

  fill:
    aod_column: "aod_055"
    merra2_column: "totexttau"

  confidence:
    rmse_low_threshold: 0.211
    rmse_high_threshold: 0.292


# ============================================================
# ERA5-Land meteorology 
# ============================================================

era5_land:
  map_stations_to_cells:
    gee_project: internship-pm25
    collection: ECMWF/ERA5_LAND/HOURLY
  
  extract:
    gee_project: internship-pm25
    collection: ECMWF/ERA5_LAND/HOURLY
    bands:
      - temperature_2m
      - dewpoint_temperature_2m
      - u_component_of_wind_10m
      - v_component_of_wind_10m
    study_start: "2025-03-01"
    study_end: "2026-03-01"
    chunk_months: 3
  
  window_qc:
    tolerance_degrees: 0.01
    window_hours: [5, 6, 7,8]
    temp_min_c: 0
    temp_max_c: 50
    wind_component_max_ms: 20
  
  daily_aggregation:
    min_hours_required: 2

# ============================================================
# ERA5-BLH
# ============================================================
era5_blh:
  map_stations_to_cells:
    gee_project: internship-pm25
    collection: ECMWF/ERA5/HOURLY
  
  extract:
    gee_project: internship-pm25
    collection: ECMWF/ERA5/HOURLY
    band: boundary_layer_height
    study_start: "2025-03-01"
    study_end: "2026-03-01"
    chunk_months: 3

  window_qc:
    tolerance_degrees: 0.05
    window_hours: [5, 6, 7, 8]
    blh_min_m: 0
    blh_max_m: 6000
  
  daily_aggregation:
    min_hours_required: 2

# ============================================================
# ESA world cover , NDVI, Elevation 
# ============================================================

static_gee_layers:
  worldcover:
    extract:
      gee_project: internship-pm25
      station_file: data/stations/cpcb_stations_delhi_status.csv
      collection: ESA/WorldCover/v200/2021
      band: Map
      buffer_radius_m: 1000
      scale_m: 10
    qc:
      station_file: data/stations/cpcb_stations_delhi_status.csv
      expected_pixels_tolerance_pct: 5
      dominant_class_warn_pct: 99
      implausible_classes: [70, 95, 100]
  
  ndvi:
    extract:
      gee_project: internship-pm25
      station_file: data/stations/cpcb_stations_delhi_status.csv
      collection: COPERNICUS/S2_SR_HARMONIZED
      buffer_radius_m: 1000
      scale_m: 10
      study_start: "2025-03-01"
      study_end: "2026-02-28"
      period_days: 5
    qc:
      station_file: data/stations/cpcb_stations_delhi_status.csv
      null_rate_warn_pct: 30
      ndvi_plausible_min: -1.0
      ndvi_plausible_max: 1.0  
    fill:
      max_fill_distance_periods: 5
  
  srtm:
    extract:
      gee_project: internship-pm25
      station_file: data/stations/cpcb_stations_delhi_status.csv
      collection: USGS/SRTMGL1_003
      buffer_radius_m: 1000
      scale_m: 30
    qc:
      station_file: data/stations/cpcb_stations_delhi_status.csv
      elevation_min_m: 150
      elevation_max_m: 300
      slope_min_deg: 0
      slope_max_deg: 15

# ============================================================================
# OSM features (road density, industrial land-use %, distance to power plant)
# ============================================================================

osm_layers:
  roads:
    extract:
      station_file: data/stations/cpcb_stations_delhi_status.csv
      roads_geojson: data/training/raw/osm/roads.geojson
      buffer_radius_m: 1000
    qc:
      station_file: data/stations/cpcb_stations_delhi_status.csv
      max_plausible_density_km_per_km2: 50

  industrial:
    extract:
      station_file: data/stations/cpcb_stations_delhi_status.csv
      industrial_geojson: data/training/raw/osm/industrial_landuse.geojson
      buffer_radius_m: 1000
    qc:
      station_file: data/stations/cpcb_stations_delhi_status.csv

  powerplants:
    extract:
      station_file: data/stations/cpcb_stations_delhi_status.csv
      powerplants_geojson: data/training/raw/osm/power_plants.geojson
    qc:
      station_file: data/stations/cpcb_stations_delhi_status.csv
      edge_effect_distance_km_threshold: 110

# ============================================================================
# Modeling (master feature table + LME/LightGBM prep)
# ============================================================================

# Prediction pipeline (the grid, its features, and inference over it).
# Kept entirely separate from the training inputs above: training and prediction
# run the same extractor scripts, so both emit a road_density.csv, a
# srtm_terrain.csv and so on. See data/training/ vs data/prediction/.
prediction:
  grid:
    # 1 km, not 5 km. 1 km is MAIAC AOD's native resolution and the buffer radius
    # every static covariate was computed at, so it is the only resolution where
    # the features mean what the model was trained on. Coarser products are
    # AGGREGATED from these cells (mean of predictions, never predictions from
    # mean features -- LightGBM is nonlinear, so mean(f(x)) != f(mean(x))).
    grid_km: 1.0
    # Matches app/api.py's DEFAULT_MAX_STATION_DISTANCE_KM. Cells beyond this are
    # refused by the API, so extracting features for them is wasted GEE time.
    # Keeps 2388 of the bbox's 2600 cells.
    coverage_radius_km: 15.0
    # Same study bbox as the station work (app/api.py BBOX_* constants).
    bbox_min_lon: 76.8381
    bbox_min_lat: 28.4126
    bbox_max_lon: 77.3477
    bbox_max_lat: 28.8814

  maiac_grid:
    # Earth Engine aborts a collection query after accumulating 5000 elements
    # (500 points x 1 week hit it on 2026-10-08). Each chunk yields roughly
    # cells x 30 days x 1.23 valid overpasses per cell-day, so 100 cells gives
    # ~3700 rows -- measured 3953 for a real 100-cell month, comfortably under.
    # Lower this if "Collection query aborted" appears.
    cells_per_chunk: 100

  osm_export:
    # Prediction-only OSM extract. The training exports were drawn around the 42
    # stations and every station sits inside them, so training has no gap and is
    # left untouched; only the grid reaches outside. Region = the study bbox plus
    # the 1 km feature buffer, so every grid cell's buffer is fully covered.
    # Training roads reach only to lon 76.8691 and industrial to 76.9119, which is
    # why 440 of 2388 one-kilometre cells would otherwise report a false zero.
    bbox_west: 76.8279
    bbox_south: 28.4036
    bbox_east: 77.3579
    bbox_north: 28.8904
    # Power plants keep the wide training bbox. The feature is distance to the
    # NEAREST plant, so the true nearest is often outside Delhi (Dadri, Jhajjar,
    # Panipat), and the 110 km edge-effect QC threshold in osm_layers.powerplants
    # is calibrated against this margin -- shrinking it would silently break that
    # gate. Sparse data, so a wide query is cheap.
    powerplant_bbox_west: 75.5
    powerplant_bbox_south: 27.0
    powerplant_bbox_east: 79.0
    powerplant_bbox_north: 30.0
    # Source is a pre-built Geofabrik regional extract, NOT the Overpass API.
    # Overpass was tried and abandoned: it refuses responses over ~2 MB (a 5 km
    # dense-Delhi box works, a 6 km one 504s in 12 s), the failures are
    # intermittent, and tiling to 4 km needed 182 requests whose projected
    # runtime climbed 91 -> 158 -> 176 minutes as it ran. No mirror works.
    # A published extract is one download, has no rate limits, and carries a
    # single timestamp -- so the vintage is an exact fact rather than "whenever
    # the tiles happened to run".
    #
    # Northern Zone covers Delhi, Haryana, Uttar Pradesh, Rajasthan and
    # Uttarakhand, so one file serves the study bbox AND the wide plant bbox.
    # TWO zones. Northern Zone does NOT contain Uttar Pradesh, and UP holds both
    # Noida/Ghaziabad (inside the study bbox) and the eastern power plants the
    # wide plant bbox exists to catch. Measured with Northern Zone alone:
    # 112 plants against the training export's 170 (all 57 east of lon 77.36
    # missing, including Dadri), and only 76% of training's roads in the
    # lon 77.30-77.36 strip. Central Zone supplies UP.
    pbf_sources:
      - url: "https://download.geofabrik.de/asia/india/northern-zone-latest.osm.pbf"
        filename: "northern-zone-latest.osm.pbf"
      - url: "https://download.geofabrik.de/asia/india/central-zone-latest.osm.pbf"
        filename: "central-zone-latest.osm.pbf"

modeling:
  master_table:
    station_file: data/stations/cpcb_stations_delhi_status.csv

  lme_prep:
    reference_season: summer
    # target_transform must be reviewed and set by hand after reading the EDA notebook
    # (notebooks/01_eda_master_feature_table.ipynb) - the prepare_lme_dataset stage
    # hard-fails while this stays NOT_SET. Set to "raw" or "log".
    target_transform: log
    drop_zero_target_rows: true
    clip_negative_aod_to_zero: true
    worldcover_drop_cols: [snow_ice_pct, mangroves_pct, moss_lichen_pct, wetland_herbaceous_pct, water_pct]
    scale_cols: [aod_055, temperature_c, relative_humidity, wind_speed, boundary_layer_height,
                 ndvi_mean, elevation_m, slope_deg, road_density_km_per_km2,
                 industrial_landuse_fraction, dist_to_nearest_powerplant_km,
                 tree_cover_pct, shrubland_pct, grassland_pct, cropland_pct,
                 built_up_pct, bare_sparse_veg_pct]

  # Raw-target LME comparison variant. Identical to lme_prep except
  # target_transform, so the raw-fit LME can be compared against LightGBM with
  # both models fit AND scored on raw ug/m3 -- scoring a log-fit model on raw
  # handicaps it with a back-transform artifact rather than any real modelling
  # deficiency. The log fit stays the model whose coefficient table is
  # interpreted (its residuals are homoscedastic; the raw fit's are not).
  lme_prep_raw_target:
    reference_season: summer
    target_transform: raw
    drop_zero_target_rows: true
    clip_negative_aod_to_zero: true
    worldcover_drop_cols: [snow_ice_pct, mangroves_pct, moss_lichen_pct, wetland_herbaceous_pct, water_pct]
    scale_cols: [aod_055, temperature_c, relative_humidity, wind_speed, boundary_layer_height,
                 ndvi_mean, elevation_m, slope_deg, road_density_km_per_km2,
                 industrial_landuse_fraction, dist_to_nearest_powerplant_km,
                 tree_cover_pct, shrubland_pct, grassland_pct, cropland_pct,
                 built_up_pct, bare_sparse_veg_pct]

  lightgbm_prep:
    reference_season: summer
    drop_zero_target_rows: true
    clip_negative_aod_to_zero: true
    worldcover_drop_cols: [snow_ice_pct, mangroves_pct, moss_lichen_pct]

  lme_validation:
    buffer_km: 2.0
    n_random_folds: 42
    random_seed: 42
  lme_winsorize:
    aod_zscore_cap: 3.0
  lme_validation_excl_outlier_stations:
    exclude_stations: "5598,6934"

  # learning_rate / max_boosting_rounds / early_stopping_rounds are repeated in
  # all three lightgbm blocks and must stay identical: a tuned hyperparameter
  # set is only valid for the learning rate it was searched under. Both
  # 01_fit_lightgbm_model.py and 02_validate_lightgbm_cv.py hard-fail on a
  # mismatch against the values recorded in the tuning stage's output json.
  lightgbm_tuning:
    station_file: data/stations/cpcb_stations_delhi_status.csv
    buffer_km: 2.0
    n_blocks: 6
    n_inner_folds: 5
    n_trials: 100
    learning_rate: 0.03
    max_boosting_rounds: 3000
    early_stopping_rounds: 100
    random_seed: 42

  lightgbm_fit:
    learning_rate: 0.03
    max_boosting_rounds: 3000
    early_stopping_rounds: 100
    validation_station_fraction: 0.15
    random_seed: 42

  # Sensitivity variant: drop the 4 stations with the weakest AOD-PM2.5
  # coupling. Selected on a criterion computed from observed data only (the
  # within-station AOD vs PM2.5 correlation), never on model performance --
  # excluding stations because they scored badly would be circular, since
  # removing the worst folds raises a pooled metric by arithmetic whatever the
  # cause. 7005 is the informative one: it couples weakly but scores a
  # respectable 0.582, so it is a station the hypothesis can fail on.
  lightgbm_diagnostics:
    n_exclude: 4
  lightgbm_validation_excl_weak_aod_coupling:
    exclude_stations: "5622,5630,6359,7005"

  # Same 4 stations, but removed from TRAINING only -- every station is still
  # evaluated, so the scoring set is identical to the primary run and any
  # change in the pooled metric is attributable purely to the training-set
  # change. Deliberately reuses the existing block hyperparameters rather than
  # re-tuning: re-tuning would change the training set AND the hyperparameters
  # at once, making a difference against the 0.803 baseline unattributable.
  # The known mismatch (those hyperparameters were searched on a 42-station
  # distribution, applied here to a 38-station training set) is a
  # suboptimality, not a leak -- each station's Hk still comes from a search
  # its own block was held out of.
  lightgbm_validation_excl_weak_aod_from_training:
    exclude_stations: "5622,5630,6359,7005"

  lightgbm_validation:
    station_file: data/stations/cpcb_stations_delhi_status.csv
    buffer_km: 2.0
    n_random_folds: 42
    random_seed: 42
    learning_rate: 0.03
    max_boosting_rounds: 3000
    early_stopping_rounds: 100
    validation_station_fraction: 0.15
    validation_row_fraction: 0.15
