# ============================================================
# CPCB ground-station pipeline (Phase 1: Delhi)
# ============================================================
cpcb_qc:
  high_value_limit: 1000
  stuck_run_limit: 3

cpcb_filter_aggregate:
  drop_stations: [10820, 10900, 10825, 6936]
  min_hours: 2

cpcb_completeness:
  threshold: 60


# ============================================================
# MAIAC AOD pipeline
# ============================================================

maiac_extract:
  gee_project: "internship-pm25"
  collection: "MODIS/061/MCD19A2_GRANULES"
  bands: ["Optical_Depth_055", "Optical_Depth_047", "AOD_Uncertainty", "AOD_QA"]
  study_start: "2025-03-01"
  study_end: "2026-02-28"

aod_filter_scale:
  scale_aod: 0.001
  scale_uncertainty: 0.0001
  aod_valid_min: -0.1
  aod_valid_max: 8.0
  uncertainty_valid_min: 0.0
  uncertainty_valid_max: 3.0

aod_qa_filter:
  strictness: "moderate"

# ============================================================  
# maiac_gapfill (calibrated MERRA-2 fill)
# ============================================================

merra2_station_mapping:
  gee_project: "internship-pm25"
  collection: "NASA/GSFC/MERRA/aer/2"
  aot_band: "TOTEXTTAU"
  test_date_start: "2025-06-01"
  test_date_end: "2025-06-02"

merra2_extraction:
  gee_project: "internship-pm25"
  collection: "NASA/GSFC/MERRA/aer/2"
  aot_band: "TOTEXTTAU"
  date_start: "2025-03-01"
  date_end: "2026-03-01"   # exclusive in filterDate, so covers through Feb 28 2026
  scale_meters: 1000

merra2_windowing_qc:
  aot_band: "TOTEXTTAU"
  overpass_hours_utc: [5, 6, 7]
  totexttau_min: 0.0
  totexttau_max: 5.0            # loose sanity bound -- catches fill values/unit bugs, not real dust-storm spikes
  coord_tolerance_degrees: 0.05   # ~5.5km -- well above scale=1000 reprojection jitter (<1km seen),
                                    # well below cell spacing (~62km) -- still catches a genuine wrong-cell bug
merra2_aggregation:
  aot_band: "TOTEXTTAU"
  min_hours_required: 2

# ============================================================
# MAIAC gap-fill calibration (per-station MAIAC ~ a + b*MERRA2)
# ============================================================

maiac_gapfill:
  calibration:
    aod_column: "aod_055"
    merra2_column: "totexttau"

  qc:
    min_obs_for_fit: 20
    min_slope: 0.0
    r_squared_warn_threshold: 0.1

  fill:
    aod_column: "aod_055"
    merra2_column: "totexttau"

  confidence:
    rmse_low_threshold: 0.211
    rmse_high_threshold: 0.292


# ============================================================
# ERA5-Land meteorology 
# ============================================================

era5_land:
  map_stations_to_cells:
    gee_project: internship-pm25
    collection: ECMWF/ERA5_LAND/HOURLY
  
  extract:
    gee_project: internship-pm25
    collection: ECMWF/ERA5_LAND/HOURLY
    bands:
      - temperature_2m
      - dewpoint_temperature_2m
      - u_component_of_wind_10m
      - v_component_of_wind_10m
    study_start: "2025-03-01"
    study_end: "2026-03-01"
    chunk_months: 3
  
  window_qc:
    tolerance_degrees: 0.01
    window_hours: [5, 6, 7,8]
    temp_min_c: 0
    temp_max_c: 50
    wind_component_max_ms: 20
  
  daily_aggregation:
    min_hours_required: 2

# ============================================================
# ERA5-BLH
# ============================================================
era5_blh:
  map_stations_to_cells:
    gee_project: internship-pm25
    collection: ECMWF/ERA5/HOURLY
  
  extract:
    gee_project: internship-pm25
    collection: ECMWF/ERA5/HOURLY
    band: boundary_layer_height
    study_start: "2025-03-01"
    study_end: "2026-03-01"
    chunk_months: 3

  window_qc:
    tolerance_degrees: 0.05
    window_hours: [5, 6, 7, 8]
    blh_min_m: 0
    blh_max_m: 6000
  
  daily_aggregation:
    min_hours_required: 2

# ============================================================
# ESA world cover , NDVI, Elevation 
# ============================================================

static_gee_layers:
  worldcover:
    extract:
      gee_project: internship-pm25
      station_file: data/stations/cpcb_stations_delhi_status.csv
      collection: ESA/WorldCover/v200/2021
      band: Map
      buffer_radius_m: 1000
      scale_m: 10
    qc:
      station_file: data/stations/cpcb_stations_delhi_status.csv
      expected_pixels_tolerance_pct: 5
      dominant_class_warn_pct: 99
      implausible_classes: [70, 95, 100]
  
  ndvi:
    extract:
      gee_project: internship-pm25
      station_file: data/stations/cpcb_stations_delhi_status.csv
      collection: COPERNICUS/S2_SR_HARMONIZED
      buffer_radius_m: 1000
      scale_m: 10
      study_start: "2025-03-01"
      study_end: "2026-02-28"
      period_days: 5
    qc:
      station_file: data/stations/cpcb_stations_delhi_status.csv
      null_rate_warn_pct: 30
      ndvi_plausible_min: -1.0
      ndvi_plausible_max: 1.0  
    fill:
      max_fill_distance_periods: 5
  
  srtm:
    extract:
      gee_project: internship-pm25
      station_file: data/stations/cpcb_stations_delhi_status.csv
      collection: USGS/SRTMGL1_003
      buffer_radius_m: 1000
      scale_m: 30
    qc:
      station_file: data/stations/cpcb_stations_delhi_status.csv
      elevation_min_m: 150
      elevation_max_m: 300
      slope_min_deg: 0
      slope_max_deg: 15

# ============================================================================
# OSM features (road density, industrial land-use %, distance to power plant)
# ============================================================================

osm_layers:
  roads:
    extract:
      station_file: data/stations/cpcb_stations_delhi_status.csv
      roads_geojson: data/raw/osm/roads.geojson
      buffer_radius_m: 1000
    qc:
      station_file: data/stations/cpcb_stations_delhi_status.csv
      max_plausible_density_km_per_km2: 50

  industrial:
    extract:
      station_file: data/stations/cpcb_stations_delhi_status.csv
      industrial_geojson: data/raw/osm/industrial_landuse.geojson
      buffer_radius_m: 1000
    qc:
      station_file: data/stations/cpcb_stations_delhi_status.csv

  powerplants:
    extract:
      station_file: data/stations/cpcb_stations_delhi_status.csv
      powerplants_geojson: data/raw/osm/power_plants.geojson
    qc:
      station_file: data/stations/cpcb_stations_delhi_status.csv
      edge_effect_distance_km_threshold: 110

# ============================================================================
# Modeling (master feature table + LME/LightGBM prep)
# ============================================================================

modeling:
  master_table:
    station_file: data/stations/cpcb_stations_delhi_status.csv

  lme_prep:
    reference_season: summer
    # target_transform must be reviewed and set by hand after reading the EDA notebook
    # (notebooks/01_eda_master_feature_table.ipynb) - the prepare_lme_dataset stage
    # hard-fails while this stays NOT_SET. Set to "raw" or "log".
    target_transform: log
    drop_zero_target_rows: true
    clip_negative_aod_to_zero: true
    worldcover_drop_cols: [snow_ice_pct, mangroves_pct, moss_lichen_pct, wetland_herbaceous_pct, water_pct]
    scale_cols: [aod_055, temperature_c, relative_humidity, wind_speed, boundary_layer_height,
                 ndvi_mean, elevation_m, slope_deg, road_density_km_per_km2,
                 industrial_landuse_fraction, dist_to_nearest_powerplant_km,
                 tree_cover_pct, shrubland_pct, grassland_pct, cropland_pct,
                 built_up_pct, bare_sparse_veg_pct]

  lightgbm_prep:
    reference_season: summer
    drop_zero_target_rows: true
    clip_negative_aod_to_zero: true
    worldcover_drop_cols: [snow_ice_pct, mangroves_pct, moss_lichen_pct]

  lme_validation:
    buffer_km: 2.0
    n_random_folds: 42
    random_seed: 42
  lme_winsorize:
    aod_zscore_cap: 3.0
  lme_validation_excl_outlier_stations:
    exclude_stations: "5598,6934"
